<section class="card" id="amis">
  <div class="icon">👥</div>
  <div>
    <h2>Liste des amis</h2>
    <div class="friend-inputs">
      @for (friend of friends; track $index) {
        <input type="text" [(ngModel)]="friends[$index]" />
      }
    </div>
    <ul>
      @for (friend of friends; track $index) {
        <li>{{ friend }}</li>
      }
    </ul>
  </div>
</section>
